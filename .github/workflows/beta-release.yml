name: Beta Release

on:
  push:
    tags:
      - 'beta*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布 Windows 测试版
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 验证连段轴核心逻辑
        run: python -m unittest tests.TestAxisChart tests.TestAxisRunner -v

      - name: 构建 Windows 安装包
        id: build-app
        uses: ok-oldking/pyappify-action@master
        continue-on-error: true

      - name: 发布 GitHub 预发行版
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'beta1.0' }}
          name: Wuwa Pilot ${{ github.ref_type == 'tag' && github.ref_name || 'beta1.0' }}
          body_path: .github/RELEASE_beta1.0.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            pyappify_dist/*-online-setup.exe
            pyappify_dist/*.zip
            pyappify_dist/*_sha256.txt
