name: Beta Release

on:
  push:
    tags:
      - 'beta*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布 Windows 测试版
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 验证连段轴核心逻辑
        run: python -m unittest tests.TestAxisChart tests.TestAxisRunner -v

      - name: 构建 Windows 安装包
        id: build-app
        uses: ok-oldking/pyappify-action@master

      - name: 发布 GitHub 预发行版
        uses: softprops/action-gh-release@v2
        with:
          name: Wuwa Pilot beta1.0
          body_path: .github/RELEASE_beta1.0.md
          prerelease: true
          files: pyappify_dist/*
