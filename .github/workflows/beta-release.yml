name: Beta Release

on:
  push:
    branches:
      - master
    tags:
      - 'beta*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 构建并发布 Windows 测试版
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 0

      - name: 准备发布
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "publish=true" >> $env:GITHUB_OUTPUT
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            exit 0
          }

          gh release view beta1.0 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f beta1.0 $env:GITHUB_SHA
          git push origin refs/tags/beta1.0 --force
          "publish=true" >> $env:GITHUB_OUTPUT
          "tag=beta1.0" >> $env:GITHUB_OUTPUT

      - name: 配置 Python
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 验证连段轴
        if: steps.release.outputs.publish == 'true'
        run: |
          python -m unittest tests.TestAxisChart tests.TestAxisRunner -v
          python -m compileall -q src/axis src/gui/AxisControlTab.py src/task/AxisPlaybackTask.py

      - name: 构建 Windows 安装包
        if: steps.release.outputs.publish == 'true'
        id: build-app
        uses: ok-oldking/pyappify-action@91cb0dfeb63d297bc260f2d7efc1a16304fba724
        with:
          version: 'v1.1.14'

      - name: 检查构建产物
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem "pyappify_dist\*-online-setup.exe" -ErrorAction SilentlyContinue)
          $zip = @(Get-ChildItem "pyappify_dist\*.zip" -ErrorAction SilentlyContinue)
          $hash = @(Get-ChildItem "pyappify_dist\*_sha256.txt" -ErrorAction SilentlyContinue)

          if ($setup.Count -lt 1) { throw "没有生成在线安装包" }
          if ($zip.Count -lt 1) { throw "没有生成便携包" }
          if ($hash.Count -lt 1) { throw "没有生成 SHA256 文件" }
          if ($setup[0].Length -lt 1MB) { throw "安装包大小异常" }
          if ($zip[0].Length -lt 1MB) { throw "便携包大小异常" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip[0].FullName)
          try {
            if ($archive.Entries.Count -eq 0) { throw "便携包内容为空" }
          } finally {
            $archive.Dispose()
          }

      - name: 发布 GitHub 预发行版
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Wuwa Pilot ${{ steps.release.outputs.tag }}
          body_path: .github/RELEASE_beta1.0.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            pyappify_dist/*-online-setup.exe
            pyappify_dist/*.zip
            pyappify_dist/*_sha256.txt
