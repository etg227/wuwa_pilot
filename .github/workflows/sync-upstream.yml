name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Sync upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ok-oldking/ok-wuthering-waves.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date"
            exit 0
          fi

          git fetch origin sync-upstream:refs/remotes/origin/sync-upstream || true
          git switch -C sync-upstream
          git merge --no-edit upstream/master
          git push --force-with-lease origin sync-upstream

          pr=$(gh pr list --base master --head sync-upstream --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base master --head sync-upstream --title "sync upstream" --body "Sync latest changes from ok-oldking/ok-wuthering-waves."
          else
            echo "PR #$pr updated"
          fi
