name: Run Tests

# 与上游 test.yml 一致；额外在 push 到 master 时也触发，因为本仓库常直接推 master。

on:
  pull_request:
    types: [ opened, synchronize ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    name: Run all tests
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "144003800+etg227@users.noreply.github.com"
          git config --global user.name "etg227"

      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          UPDATE_REPO_TOKEN: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'UPDATE_REPO_TOKEN',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }

          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              try {
                  python -m unittest $_.FullName

                  if ($LASTEXITCODE -ne 0) {
                      throw "Tests failed in $($_.FullName)"
                  }
              } catch {
                  Write-Error $_
                  exit 1
              }
          }
